<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SDL Workflows Explorer</title>
    <script>
      // Theme before the first paint, so a dark theme never flashes light: the visitor's stored choice, else the
      // system scheme (SPEC-SITE-001 REQ-008; SPEC-UI-001 REQ-005). Mirrors resolveTheme in src/lib/siteTokens.ts.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("sdl-theme");
        } catch (e) {}
        var dark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = stored === "light" || stored === "dark" ? stored : dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
